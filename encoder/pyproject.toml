[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modmodmod-warmstart"
version = "0.1.0"
description = "Train per-community moderation heads over frozen text embeddings."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.urls]
# Set to the public repository on release; kept anonymized while the paper is under review.
Homepage = "https://github.com/ANONYMIZED/modmodmod-warmstart"

[project.scripts]
modmodmod-warmstart = "modmodmod_warmstart.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modmodmod_warmstart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
